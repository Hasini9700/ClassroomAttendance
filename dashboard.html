<!DOCTYPE html>
<html>
<head>
  <title>Attendance Dashboard</title>

  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <style>
    body { font-family: Arial; text-align: center; }

    h2 { margin-top: 20px; }

    .box {
      display: inline-block;
      padding: 15px;
      margin: 10px;
      border-radius: 10px;
      color: white;
      font-weight: bold;
    }

    .total { background: #333; }
    .present { background: green; }
    .absent { background: red; }
    .suspicious { background: orange; }

    table {
      margin: auto;
      border-collapse: collapse;
      width: 70%;
      margin-top: 20px;
    }

    th, td {
      border: 1px solid black;
      padding: 10px;
    }

    th {
      background-color: #4CAF50;
      color: white;
    }

    .sus { background-color: #ffcccc; }
  </style>
</head>

<body>

<h2>📊 Attendance Dashboard</h2>

<div id="summary"></div>

<table>
  <thead>
    <tr>
      <th>Roll No</th>
      <th>Time</th>
      <th>Status</th>
    </tr>
  </thead>
  <tbody id="tableBody"></tbody>
</table>

<script>

const firebaseConfig = {
  apiKey: "AIzaSyDylqw6RlYNr63Ql-Uv30ucfDbV7qN6u8Q",
  authDomain: "classroomattendance-8fca8.firebaseapp.com",
  projectId: "classroomattendance-8fca8"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const totalStudents = 20;

function loadDashboard() {

  db.collection("attendance").get().then(snapshot => {

    let present = 0;
    let suspicious = 0;

    let html = "";
    let deviceMap = {};

    snapshot.forEach(doc => {
      const data = doc.data();
      present++;

      // Count device usage
      if (deviceMap[data.deviceId]) {
        deviceMap[data.deviceId]++;
      } else {
        deviceMap[data.deviceId] = 1;
      }
    });

    snapshot.forEach(doc => {
      const data = doc.data();

      let status = "Normal";
      let rowClass = "";

      if (deviceMap[data.deviceId] > 1) {
        status = "⚠ Suspicious";
        rowClass = "sus";
        suspicious++;
      }

      html += `
        <tr class="${rowClass}">
          <td>${data.rollNo}</td>
          <td>${data.time}</td>
          <td>${status}</td>
        </tr>
      `;
    });

    document.getElementById("tableBody").innerHTML = html;

    let absent = totalStudents - present;
    let percent = ((present / totalStudents) * 100).toFixed(2);

    document.getElementById("summary").innerHTML = `
      <div class="box total">Total: ${totalStudents}</div>
      <div class="box present">Present: ${present}</div>
      <div class="box absent">Absent: ${absent}</div>
      <div class="box suspicious">Suspicious: ${suspicious}</div>
      <div class="box total">Attendance %: ${percent}%</div>
    `;
  });
}

loadDashboard();

</script>

</body>
</html>
