<!DOCTYPE html>
<html>
<head>
  <title>Classroom Attendance - Mobile Friendly</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    select, button { padding: 10px; font-size: 16px; margin: 5px; }
    p { font-size: 16px; color: green; }
  </style>
</head>
<body>
  <h2>Classroom Attendance</h2>

  <div id="attendanceDiv">
    <label for="studentId">Select Your Student ID:</label><br>
    <select id="studentId">
      <option value="">-- Select ID --</option>
    </select><br>
    <button onclick="markAttendance()">Mark Attendance</button>
    <p id="msg"></p>
  </div>

  <script>
    // Step 1: List of students
    const students = {
      "5H3": "N.Hasini",
      "5G9": "M.Akshara",
      "506": "E.Rajasri",
      "5E4": "M.Navaneetha",
      "5J2": "P.Sri sai vyshnavi",
      "5G8": "M.Srishynei",
      "5H2": "O.Vandana",
      "5D3": "K.Harshitha",
      "510": "K.Indhu",
      "509": "J.Kaveri",
      "5K5": "R.Chandana",
      "5E8": "M.Keerthana",
      "5J0": "P.Jahnavi",
      "5F8": "Md.Sofiya",
      "5F2": "M.Bhrahmani",
      "5F4": "Meharaj",
      "5H1": "N.Srivinya",
      "5H2": "N.Sreeja",
      "5G2": "M.Sreechandana",
      "505": "C.Shivani"
    };

    // Step 2: Populate dropdown
    const studentSelect = document.getElementById("studentId");
    for (let id in students) {
      let option = document.createElement("option");
      option.value = id;
      option.text = id + " - " + students[id];
      studentSelect.add(option);
    }

    // Step 3: Mark attendance
    function markAttendance() {
      const id = studentSelect.value;
      const today = new Date().toISOString().substring(0,10); // YYYY-MM-DD

      if (!id) {
        document.getElementById("msg").style.color = "red";
        document.getElementById("msg").innerText = "Please select your Student ID!";
        return;
      }

      const attendanceKey = id + "_" + today;

      if(localStorage.getItem(attendanceKey)){
        document.getElementById("msg").style.color = "orange";
        document.getElementById("msg").innerText = "⚠ Attendance already marked today for " + students[id];
      } else {
        localStorage.setItem(attendanceKey, "Present");
        document.getElementById("msg").style.color = "green";
        document.getElementById("msg").innerText = "✅ Attendance marked for " + students[id];
      }
    }
  </script>
</body>
</html>
