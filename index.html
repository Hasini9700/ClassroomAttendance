<!DOCTYPE html>
<html>
<head>
  <title>QR Attendance - Simple Version (No Camera)</title>
  <style>
    body { font-family: Arial; text-align: center; margin-top: 50px; }
    input, button { padding: 10px; font-size: 16px; margin: 5px; }
  </style>
</head>
<body>
  <h2>Classroom Attendance</h2>

  <!-- Login -->
  <div id="loginDiv">
    <input type="text" id="studentId" placeholder="Enter Student ID"><br>
    <input type="text" id="sessionCode" placeholder="Enter Session Code"><br>
    <button onclick="markAttendance()">Mark Attendance</button>
    <p id="msg" style="color:red;"></p>
  </div>

  <script>
    // Student list
    const students = {
      "5H3": "N.Hasini",
      "5G9": "M.Akshara",
      "506": "E.Rajasri",
      "5E4": "M.Navaneetha",
      "5J2": "P.Sri sai vyshnavi",
      "5G8": "M.Srishynei",
      "5H2": "O.Vandana",
      "5D3": "K.Harshitha",
      "510": "K.Indhu",
      "509": "J.Kaveri",
      "5K5": "R.Chandana",
      "5E8": "M.Keerthana",
      "5J0": "P.Jahnavi",
      "5F8": "Md.Sofiya",
      "5F2": "M.Bhrahmani",
      "5F4": "Meharaj",
      "5H1": "N.Srivinya",
      "5H2": "N.Sreeja",
      "5G2": "M.Sreechandana",
      "505": "C.Shivani"
    };

    function markAttendance(){
      const id = document.getElementById("studentId").value.trim().toUpperCase();
      const session = document.getElementById("sessionCode").value.trim().toUpperCase();
      const today = new Date().toISOString().substring(0,10);

      if(!students[id]){
        document.getElementById("msg").innerText = "Invalid Student ID!";
        return;
      }

      if(!session.startsWith("ATTENDANCE_SESSION_")){
        document.getElementById("msg").innerText = "Invalid Session Code!";
        return;
      }

      const attendanceKey = id + "_" + today;

      if(localStorage.getItem(attendanceKey)){
        document.getElementById("msg").innerText = "⚠ Attendance already marked today!";
      } else {
        localStorage.setItem(attendanceKey, session);
        document.getElementById("msg").innerText = "✅ Attendance Marked for " + students[id];
      }
    }
  </script>
</body>
</html>
