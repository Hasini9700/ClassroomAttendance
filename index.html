<!DOCTYPE html>
<html>
<head>
  <title>Smart QR Attendance</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

  <!-- QR Scanner -->
  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>
    body {
      font-family: Arial;
      text-align: center;
      margin-top: 50px;
      background-color: #f5f5f5;
    }

    h2 {
      color: #333;
    }

    input, button {
      padding: 10px;
      font-size: 16px;
      margin: 8px;
      border-radius: 5px;
      border: 1px solid #ccc;
    }

    button {
      background-color: #4CAF50;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background-color: #45a049;
    }

    #qr-reader {
      width: 300px;
      margin: auto;
    }

    #scanMsg {
      font-weight: bold;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <h2>📚 Smart Classroom Attendance System</h2>

  <!-- LOGIN -->
  <div id="loginDiv">
    <input type="text" id="roll" placeholder="Enter Roll Number">
    <br>
    <button onclick="login()">Login & Scan</button>
    <p id="loginMsg" style="color:red;"></p>
  </div>

  <!-- SCANNER -->
  <div id="scannerDiv" style="display:none;">
    <h3>📷 Scan Faculty QR Code</h3>
    <div id="qr-reader"></div>
    <p id="scanMsg"></p>
  </div>

  <script>

    // Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyDylqw6RlYNr63Ql-Uv30ucfDbV7qN6u8Q",
      authDomain: "classroomattendance-8fca8.firebaseapp.com",
      projectId: "classroomattendance-8fca8",
      storageBucket: "classroomattendance-8fca8.appspot.com",
      messagingSenderId: "410636907176",
      appId: "1:410636907176:web:24459ea8af9dabcc37889d"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    let currentStudentId = "";
    let scanner;

    // LOGIN FUNCTION
    function login() {
      const roll = document.getElementById("roll").value.trim();

      if (!roll) {
        document.getElementById("loginMsg").innerText = "❌ Please enter Roll Number";
        return;
      }

      currentStudentId = roll;

      document.getElementById("loginDiv").style.display = "none";
      document.getElementById("scannerDiv").style.display = "block";

      startScanner();
    }

    // START SCANNER
    function startScanner() {

      scanner = new Html5Qrcode("qr-reader");

      scanner.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: 250 },

        (qrData) => {
          processAttendance(qrData);
          scanner.stop();
        },

        (error) => {}
      );
    }

    // PROCESS ATTENDANCE
    function processAttendance(qrData) {

      // Validate QR
      if (!qrData.startsWith("ATTENDANCE_SESSION_")) {
        document.getElementById("scanMsg").innerText = "❌ Invalid QR Code!";
        return;
      }

      const today = new Date();
      const date = today.toISOString().substring(0, 10);
      const time = today.toTimeString().substring(0, 5);

      const docId = currentStudentId + "_" + date;

      db.collection("attendance").doc(docId).get().then(doc => {

        if (doc.exists) {
          document.getElementById("scanMsg").innerText =
            "⚠ Attendance already marked today!";
        } else {

          db.collection("attendance").doc(docId).set({
            rollNo: currentStudentId,
            date: date,
            time: time,
            session: qrData
          });

          document.getElementById("scanMsg").innerText =
            "✅ Attendance Marked Successfully!";
        }
      });
    }

  </script>

</body>
</html>
